<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - Kantor Kurator</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same palette and typeface as the dashboard, so logging in feels like the same place. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: #0b0a0f;
    color: #f4f1f7; font-family: "Outfit", system-ui, "Segoe UI", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 380px; background: #141219; border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 28px 26px 24px; }
  .pfp { width: 64px; height: 64px; border-radius: 12px; image-rendering: pixelated; display: block; margin-bottom: 16px; }
  .kicker { display: block; font-size: 13px; color: #8a83a3; }
  h1 { font-size: 24px; font-weight: 600; margin: 2px 0 20px; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: #8a83a3; font-weight: 400; }
  label { display: block; font-size: 13px; color: #b3adc4; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 15px; color: #f4f1f7; background: #1b1823;
    border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; padding: 11px 13px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid #9b8cd4; outline-offset: 2px; }
  button {
    width: 100%; margin-top: 22px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    color: #0b0a0f; background: #9b8cd4; border: 0; border-radius: 10px; padding: 12px;
  }
  button:hover { background: #ab9ee0; }
  button[disabled] { opacity: 0.6; cursor: wait; }
  .err { min-height: 20px; margin-top: 12px; font-size: 13px; color: #f2bdba; }
</style>
</head>
<body>
  <form class="card" id="form">
    <img class="pfp" src="/favicon.png" alt="">
    <span class="kicker">Organisasi agen AI</span>
    <h1>Kantor Kurator <em>/ masuk</em></h1>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="go" type="submit">Masuk ke dashboard</button>
    <div class="err" id="err" role="alert"></div>
  </form>

<script>
document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; go.textContent = 'Memeriksa...'; err.textContent = '';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
  }).then(function (r) {
    return r.json().then(function (d) {
      if (r.ok) return location.replace('/');
      err.textContent = d.error || 'Gagal masuk.';
    });
  }).catch(function () {
    err.textContent = 'Server nggak bisa dihubungi.';
  }).then(function () {
    go.disabled = false; go.textContent = 'Masuk ke dashboard';
  });
});
</script>
</body>
</html>
