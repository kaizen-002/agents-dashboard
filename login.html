<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - Kantor Kurator</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(760px 420px at 12% -12%, #1a1526 0%, transparent 62%),
      radial-gradient(680px 380px at 92% -4%, #101d28 0%, transparent 58%),
      #0b0a0f;
    color: #f4f1f7; font-family: "Outfit", system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 380px; background: #141219; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 30px 28px 26px; }
  .pfp { width: 64px; height: 64px; border-radius: 16px; image-rendering: pixelated; display: block; margin-bottom: 18px; }
  .kicker { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #9b8cd4; }
  h1 { font-size: 24px; font-weight: 600; margin: 4px 0 22px; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: #6f6889; font-weight: 400; }
  label { display: block; font-size: 12px; color: #a8a1bb; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 14px; color: #f4f1f7; background: #1b1823;
    border: 1px solid rgba(255,255,255,0.11); border-radius: 12px; padding: 11px 13px; outline: none;
    transition: border-color 180ms, box-shadow 180ms;
  }
  input:focus { border-color: #9b8cd4; box-shadow: 0 0 0 3px rgba(155,140,212,0.18); }
  button {
    width: 100%; margin-top: 22px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    color: #0b0a0f; background: #9b8cd4; border: 0; border-radius: 12px; padding: 12px;
    transition: transform 160ms, opacity 160ms;
  }
  button:active { transform: scale(0.98); }
  button[disabled] { opacity: 0.6; cursor: wait; }
  .err { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: #f2bdba; }
</style>
</head>
<body>
  <form class="card" id="form">
    <img class="pfp" src="/favicon.png" alt="">
    <span class="kicker">organisasi agen ai</span>
    <h1>Kantor Kurator <em>/ masuk</em></h1>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="go" type="submit">Masuk</button>
    <div class="err" id="err" role="alert"></div>
  </form>

<script>
document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; go.textContent = 'Memeriksa...'; err.textContent = '';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
  }).then(function (r) {
    return r.json().then(function (d) {
      if (r.ok) return location.replace('/');
      err.textContent = d.error || 'Gagal masuk.';
    });
  }).catch(function () {
    err.textContent = 'Server nggak bisa dihubungi.';
  }).then(function () {
    go.disabled = false; go.textContent = 'Masuk';
  });
});
</script>
</body>
</html>
