<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor Kurator</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Design reasons, one line each.
     - Dark only: the pixel station is a night scene with neon rooms; a light theme would fight it.
     - One typeface (Outfit) for all UI text; the only pixel font lives inside the canvas, as part of the art.
     - Seven agent colours are identity, not decoration: the same colour marks an agent in its room, the roster and the log.
     - Green, amber and red only ever mean working, waiting and error.
     - Faint grid behind the station: it is the space around the rooms, drawn in the canvas.
     - Motion only where something changed: new rows slide in, the live dot pulses, toasts announce new work. */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink-0: #f4f1f7;
    --ink-1: #b3adc4;
    --ink-2: #8a83a3;   /* 5.2:1 on panels, passes WCAG AA for small text */

    --bg: #0b0a0f;
    --panel: #141219;
    --panel-2: #1b1823;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.13);

    --accent: #9b8cd4;
    --ok: #63c88a;
    --warn: #d9a45b;
    --bad: #d97570;

    --font: "Outfit", system-ui, "Segoe UI", sans-serif;
    --r-panel: 16px;
    --r-inner: 10px;
    --r-small: 6px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  body {
    background: var(--bg);
    color: var(--ink-0);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    padding: 24px clamp(12px, 3vw, 36px) 44px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1340px; margin: 0 auto; }

  /* visible keyboard focus everywhere */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-small); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- header ---------- */
  header { display: flex; align-items: flex-end; gap: 16px 20px; flex-wrap: wrap; margin-bottom: 18px; }
  .kicker { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  h1 em { font-style: normal; font-weight: 400; color: var(--ink-2); }

  .link {
    margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px; color: var(--ink-1);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-inner); padding: 8px 14px;
  }
  .link .clock { color: var(--ink-2); }
  .quiet { font-size: 13px; color: var(--ink-2); padding: 2px 4px; border-radius: var(--r-small); }
  .quiet:hover { color: var(--ink-0); }

  /* live dot: the only pulsing thing, because it is the only thing that is live */
  .led { width: 8px; height: 8px; border-radius: 50%; background: #4a4360; flex-shrink: 0; }
  .led.ok { background: var(--ok); animation: ping 2.8s infinite ease-out; }
  .led.bad { background: var(--bad); }
  .led.wait { background: var(--warn); }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(99,200,138,0.45); } 70%, 100% { box-shadow: 0 0 0 7px rgba(99,200,138,0); } }

  /* ---------- layout ---------- */
  .top { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 1080px) { .top { grid-template-columns: minmax(0, 1fr); } }

  .shell { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 8px; min-width: 0; }

  .bar { display: flex; align-items: center; gap: 8px 16px; padding: 6px 8px 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-1); }
  .bar .status { display: flex; align-items: center; gap: 8px; }
  .bar .title { margin: 0 auto; }
  .bar .title b { color: var(--ink-0); font-weight: 600; }
  .text-btn { font-size: 13px; color: var(--accent); padding: 4px 8px; border-radius: var(--r-small); }
  .text-btn:hover { background: var(--panel-2); }
  .text-btn[hidden] { display: none; }

  /* ---------- station ---------- */
  .world { position: relative; background: #07080d; border-radius: var(--r-inner); overflow: hidden; padding: 12px; display: flex; justify-content: center; }
  .world canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }

  .notes { position: absolute; right: 12px; top: 12px; z-index: 10; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
  .notes div {
    background: rgba(11,10,15,0.9); border: 1px solid var(--line-2); border-radius: var(--r-small);
    padding: 5px 12px; font-size: 12.5px; color: var(--ink-0);
    animation: slide 380ms var(--ease), dim 400ms ease 3.6s forwards;
  }
  @keyframes slide { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dim { to { opacity: 0; } }

  .keymap { display: flex; gap: 6px 16px; flex-wrap: wrap; padding: 12px 10px 4px; font-size: 12.5px; color: var(--ink-2); }
  .keymap span { display: flex; align-items: center; gap: 6px; }
  .keymap s { width: 8px; height: 8px; border-radius: 50%; text-decoration: none; }

  /* ---------- roster ---------- */
  .roster { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 16px 16px 8px; }
  .roster h2, .card h2 {
    font-size: 14px; font-weight: 600; color: var(--ink-0);
    margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline;
  }
  .roster h2 em, .card h2 em { font-style: normal; font-weight: 400; color: var(--ink-2); }

  .unit {
    display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    width: calc(100% + 16px); text-align: left;
    padding: 9px 8px; margin: 0 -8px; border-radius: var(--r-inner); cursor: pointer;
  }
  .unit:hover { background: var(--panel-2); }
  .unit.picked { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); }
  .unit .swatch { width: 6px; height: 30px; border-radius: 3px; }
  .unit .nm2 { display: block; font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .unit .doing { display: block; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* status badge: kept, because it is the one piece of state you scan the list for */
  .unit .state { font-size: 12px; padding: 2px 8px; border-radius: var(--r-small); color: var(--ink-1); background: rgba(255,255,255,0.05); white-space: nowrap; }
  .unit .state.busy { color: #97dcb2; background: rgba(99,200,138,0.12); }
  .unit .state.broke { color: #f2bdba; background: rgba(217,117,112,0.14); }
  .unit .state.old { color: #d3ab98; background: rgba(190,140,120,0.1); }

  /* ---------- bottom cards ---------- */
  .deck { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 16px 18px; min-width: 0; }

  /* rows slide in only when the list actually changed */
  .line2, .doc, .cut { animation: rowin 420ms var(--ease) backwards; }
  @keyframes rowin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .line2 { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .line2:last-child { border-bottom: 0; }
  .num { font-size: 12.5px; color: var(--ink-2); }
  .name3 { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .yr { font-size: 12.5px; color: var(--ink-2); }
  .meter { display: flex; align-items: center; gap: 8px; }
  .rail2 { display: block; width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .lvl { display: block; height: 100%; background: var(--accent); }
  .lvlnum { font-size: 12.5px; color: var(--ink-1); min-width: 16px; text-align: right; }

  .doc { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .doc:last-child { border-bottom: 0; }
  /* file type as coloured text, no capsule */
  .kind { font-size: 12.5px; min-width: 52px; color: var(--ink-1); }
  .kind.script { color: #97dcb2; }
  .kind.assets { color: #e8c98a; }
  .kind.watch { color: #93c9ee; }
  .kind.links { color: #e8a8cf; }
  .when { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }

  .log { max-height: 240px; overflow-y: auto; }
  .beat { display: flex; gap: 9px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .beat:last-child { border-bottom: 0; }
  .beat s { width: 7px; height: 7px; border-radius: 50%; text-decoration: none; flex-shrink: 0; }
  .beat time { font-size: 12.5px; color: var(--ink-2); margin-left: auto; flex-shrink: 0; }

  .cut { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cut:last-child { border-bottom: 0; }
  .cut .verdict { font-size: 12px; padding: 2px 8px; border-radius: var(--r-small); color: var(--ink-1); background: rgba(255,255,255,0.05); white-space: nowrap; }
  .cut .verdict.good { color: #97dcb2; background: rgba(99,200,138,0.12); }
  .cut .verdict.bad { color: #f2bdba; background: rgba(217,117,112,0.14); }
  .cut .verdict.draft { color: #e8c98a; background: rgba(217,164,91,0.12); }
  .cut .about { min-width: 0; }
  .cut .about b { display: block; font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cut .about span { display: block; font-size: 12.5px; color: var(--ink-2); }
  .grab { margin-left: auto; font-size: 13px; text-decoration: none; color: var(--ink-0);
    background: rgba(255,255,255,0.06); border: 1px solid var(--line-2); border-radius: var(--r-inner); padding: 6px 12px; white-space: nowrap; }
  .grab:hover { background: rgba(255,255,255,0.11); }
  span.grab { color: var(--ink-2); background: none; }

  .none { color: var(--ink-2); font-size: 13px; padding: 8px 0; }
  .none b { display: block; color: var(--ink-1); font-weight: 500; margin-bottom: 2px; }
  .lost { color: #f2bdba; }

  .skeleton { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.06); margin: 11px 0; }

  @media (max-width: 560px) {
    h1 { font-size: 23px; }
    .link { margin-left: 0; width: 100%; }
    .bar .title { margin: 0; }
    .world { padding: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <span class="kicker">Organisasi agen AI</span>
    <h1>Kantor Kurator <em>/ stasiun</em></h1>
  </div>
  <div class="link">
    <span class="led wait" id="led"></span><span id="linktext" role="status">menyambung</span><span class="clock" id="clock"></span>
    <span id="logout" hidden>
      <button type="button" class="quiet" id="out-here">Keluar</button>
      <button type="button" class="quiet" id="out-all" title="Keluar dari semua perangkat">Keluar di semua perangkat</button>
    </span>
  </div>
</header>

<div class="top">

  <section class="shell" aria-label="Stasiun agen">
    <div class="bar">
      <span class="status"><span class="led" id="gateled"></span><span id="gatetext">gateway</span></span>
      <span class="title"><b id="workcount2">0/7</b> agen sedang kerja</span>
      <button type="button" class="text-btn" id="clearpick" hidden>Lepas sorotan</button>
    </div>

    <div class="world" id="world">
      <canvas id="station" role="img" aria-label="Peta stasiun: tiap agen punya ruangan, klik agen atau ruangannya untuk menyorot. Daftar agen di samping bisa dipakai dengan keyboard."></canvas>
      <div class="notes" id="notes" aria-live="polite"></div>
    </div>

    <div class="keymap">
      <span><s style="background:#63c88a"></s>Duduk di ruangannya: kerja</span>
      <span><s style="background:#d97570"></s>Ruangan berkedip merah: error</span>
      <span><s style="background:#a8a1bb"></s>Nongkrong di Jembatan: nganggur</span>
      <span><s style="background:#c7b6ff"></s>Ada huruf Z: tidur</span>
    </div>
  </section>

  <section class="roster" aria-label="Daftar agen">
    <h2>Agen <em id="workcount"></em></h2>
    <div id="units">
      <div class="skeleton" style="width:90%"></div>
      <div class="skeleton" style="width:70%"></div>
      <div class="skeleton" style="width:80%"></div>
    </div>
  </section>

</div>
<div class="deck">
  <section class="card">
    <h2>Topik terakhir <em id="topiccount"></em></h2>
    <div id="topics"><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:60%"></div></div>
  </section>
  <section class="card">
    <h2>File terbaru</h2>
    <div id="files"><div class="skeleton" style="width:75%"></div><div class="skeleton" style="width:55%"></div></div>
  </section>
  <section class="card">
    <h2>Hasil video <em id="rendercount"></em></h2>
    <div id="renders"><div class="skeleton" style="width:70%"></div></div>
  </section>
  <section class="card">
    <h2>Aktivitas</h2>
    <div class="log" id="log" aria-live="polite"><div class="none">Menunggu agen bergerak.</div></div>
  </section>
</div>

</div>

<script>
var TINT = {
  'lore-scout':   '#b39ae8',
  'script-writer':'#6fd49a',
  'asset-lister': '#e8bd6a',
  'watcher':      '#7cc2ea',
  'fetcher':      '#e493c4',
  'editor':       '#f0916b',
  'checker':      '#8fd4cf'
};

var WORD  = { working: 'kerja', error: 'error', idle: 'nganggur', sleeping: 'tidur' };
var EVENT = { working: 'mulai kerja', error: 'error', idle: 'selesai', sleeping: 'tidur' };
var HUE   = { working: '#63c88a', error: '#d97570', idle: '#a8a1bb', sleeping: '#c7b6ff' };

var cast = {}, picked = null;

function h(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var beats = [], lastDocs = null, sigTopics = null, sigDocs = null, sigUnits = null, sigRenders = null;
var everLoaded = false;

/* ================= station geometry =================
   Logical pixels, drawn once at 1x and scaled up without smoothing. Neon glow is added on top
   at screen resolution, so pixels stay crisp and light stays soft, like the reference station.
   Nine cells in a 3x3 grid: the bridge on top, the studio in the middle, one empty bay. */

var RW = 208, RH = 152, GAP = 26, M = 18;
var STEPX = RW + GAP, STEPY = RH + GAP;
var LW = M * 2 + RW * 3 + GAP * 2, LH = M * 2 + RH * 3 + GAP * 2;
var WALL = 10;
var CX = RW / 2, CY = RH / 2;          /* room centre */
var DOOR = 18;                          /* door opening width */

var ROOMS = [
  { id: 'lore-scout',    c: 0, r: 0, name: 'ARSIP',       tint: '#b39ae8', kind: 'library' },
  { id: 'hub',           c: 1, r: 0, name: 'JEMBATAN',    tint: '#ff9d3c', kind: 'bridge', laneY: 128 },
  { id: 'script-writer', c: 2, r: 0, name: 'NASKAH',      tint: '#6fd49a', kind: 'writing' },
  { id: 'asset-lister',  c: 0, r: 1, name: 'GUDANG',      tint: '#e8bd6a', kind: 'storage' },
  { id: 'editor',        c: 1, r: 1, name: 'STUDIO',      tint: '#5fe08a', kind: 'workshop' },
  { id: 'watcher',       c: 2, r: 1, name: 'BIOSKOP',     tint: '#5cc8f0', kind: 'cinema' },
  { id: 'fetcher',       c: 0, r: 2, name: 'DOK DATA',    tint: '#e46fd0', kind: 'servers' },
  { id: 'checker',       c: 1, r: 2, name: 'LAB',         tint: '#6fe0d6', kind: 'lab' },
  { id: 'empty',         c: 2, r: 2, name: 'RUANG KOSONG', tint: '#6b6f7a', kind: 'empty' }
];
ROOMS.forEach(function (rm, i) {
  rm.i = i; rm.x = M + rm.c * STEPX; rm.y = M + rm.r * STEPY;
  if (rm.laneY === undefined) rm.laneY = CY;
});

function roomById(id) { for (var i = 0; i < ROOMS.length; i++) if (ROOMS[i].id === id) return ROOMS[i]; return null; }
function roomAtCell(c, r) { for (var i = 0; i < ROOMS.length; i++) if (ROOMS[i].c === c && ROOMS[i].r === r) return ROOMS[i]; return null; }
function walkable(rm) { return rm && rm.kind !== 'empty'; }
function roomAtPoint(x, y) {
  var c = Math.floor((x - M + GAP / 2) / STEPX), r = Math.floor((y - M + GAP / 2) / STEPY);
  return roomAtCell(Math.max(0, Math.min(2, c)), Math.max(0, Math.min(2, r)));
}
function linked(a, b) { return walkable(a) && walkable(b) && Math.abs(a.c - b.c) + Math.abs(a.r - b.r) === 1; }

/* where an agent sits: in front of the desk in the top-left corner, facing it */
var SEAT = { x: 54, y: 58 };
var IDLE_SPOTS = [[40, 128], [64, 128], [144, 128], [168, 128], [104, 140], [26, 110], [182, 110]];

/* ================= colour helpers ================= */

function rgb(hx) { return [1, 3, 5].map(function (i) { return parseInt(hx.slice(i, i + 2), 16); }); }
function mix(a, b, t) {
  var p = rgb(a), q = rgb(b);
  return '#' + p.map(function (v, i) { return ('0' + Math.max(0, Math.min(255, Math.round(v + (q[i] - v) * t))).toString(16)).slice(-2); }).join('');
}
function hash(x, y) { var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }

/* ================= 3x5 bitmap font ================= */

var GLYPH = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
  F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
  K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
  P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
  U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
  Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
  '4':'101101111001001','5':'111100110001110','6':'011100110101010','7':'111001010010010','8':'010101010101010',
  '9':'010101011001110',' ':'000000000000000','.':'000000000000010',':':'000010000010000','-':'000000111000000',
  '/':'001001010100100','!':'010010010000010','?':'110001010000010','+':'000010111010000','%':'101001010100101',
  ',':'000000000010100','(':'010100100100010',')':'010001001001010','_':'000000000000111'
};
function clean(s, max) {
  s = String(s || '').toUpperCase().replace(/[^A-Z0-9 .:\-\/!?+%,()_]/g, ' ').replace(/ +/g, ' ').trim();
  return s.length > max ? s.slice(0, max - 1) + '.' : s;
}
function textWidth(s, size) { return (s.length * 4 - 1) * (size || 1); }
function text(g, s, x, y, col, size) {
  var k = size || 1;
  g.fillStyle = col;
  for (var i = 0; i < s.length; i++) {
    var bits = GLYPH[s[i]] || GLYPH[' '];
    for (var b = 0; b < 15; b++) if (bits[b] === '1') g.fillRect(x + (i * 4 + (b % 3)) * k, y + Math.floor(b / 3) * k, k, k);
  }
}

/* ================= static station, drawn once ================= */

var SCREENS = [], LEDS = [], WATER = [], STEAM = [], HOLO = [], TUBES = [], LAMPS = [], REACTOR = null, BIGSCREEN = null;

function paintStatic() {
  var cv = document.createElement('canvas');
  cv.width = LW; cv.height = LH;
  var g = cv.getContext('2d');
  function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  /* deep space floor with a faint panel grid */
  R(0, 0, LW, LH, '#07080d');
  for (var gy = 0; gy < LH; gy += 16) for (var gx = 0; gx < LW; gx += 16) {
    R(gx, gy, 16, 1, '#0c0e15'); R(gx, gy, 1, 16, '#0c0e15');
    if (hash(gx, gy) > 0.93) R(gx + 7, gy + 7, 2, 2, '#141826');
  }

  /* walkways between rooms: light metal bridges with rails and hazard studs */
  ROOMS.forEach(function (rm) {
    var right = roomAtCell(rm.c + 1, rm.r), down = roomAtCell(rm.c, rm.r + 1);
    if (linked(rm, right)) bridge(rm.x + RW - 4, rm.y + CY - DOOR / 2 - 3, GAP + 8, DOOR + 6, true);
    if (linked(rm, down)) bridge(rm.x + CX - DOOR / 2 - 3, rm.y + RH - 4, DOOR + 6, GAP + 8, false);
  });
  function bridge(x, y, w, h, horiz) {
    R(x, y, w, h, '#aeb5c2');
    if (horiz) {

/* ================= agents ================= */

function Agent(info, i) {
  this.name = info.name; this.i = i; this.tint = TINT[info.name] || '#aaaaaa';
  var home = roomById(info.name);
  this.x = home.x + CX; this.y = home.y + home.laneY;
  this.path = []; this.goalKey = ''; this.state = 'sleeping'; this.task = ''; this.runs = 0; this.at = null;
  this.face = 'down'; this.walkT = 0; this.nextWander = 0; this.spot = null;
}

function cellKey(rm) { return rm.c + ',' + rm.r; }

function route(fromRoom, toRoom) {
  var queue = [[fromRoom]], seen = {};
  seen[cellKey(fromRoom)] = true;
  while (queue.length) {
    var p = queue.shift(), lastRoom = p[p.length - 1];
    if (lastRoom === toRoom) return p;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
      var n = roomAtCell(lastRoom.c + d[0], lastRoom.r + d[1]);
      if (n && linked(lastRoom, n) && !seen[cellKey(n)]) { seen[cellKey(n)] = true; queue.push(p.concat([n])); }
    });
  }
  return [fromRoom];
}

/* Each room has a walking lane (its centre row, or lower in the bridge so nobody walks through the reactor).
   Paths go: current spot, lane, doorway, next room's doorway, its lane, and so on. All moves are straight lines. */
function doorPoint(rm, dc, dr) {
  if (dc === 1) return [rm.x + RW - WALL - 6, rm.y + CY];
  if (dc === -1) return [rm.x + WALL + 6, rm.y + CY];
  if (dr === 1) return [rm.x + CX, rm.y + RH - WALL - 6];
  return [rm.x + CX, rm.y + WALL + 6];
}

function plan(a, room, lx, ly) {
  var here = roomAtPoint(a.x, a.y), pts = [];
  pts.push([a.x, here.y + here.laneY]);
  var hops = route(here, room);
  for (var k = 1; k < hops.length; k++) {
    var A = hops[k - 1], B = hops[k], dc = B.c - A.c, dr = B.r - A.r;
    var out = doorPoint(A, dc, dr), inn = doorPoint(B, -dc, -dr);
    pts.push([out[0], A.y + A.laneY]);
    pts.push(out);
    pts.push(inn);
    pts.push([inn[0], B.y + B.laneY]);
  }
  pts.push([room.x + lx, room.y + room.laneY]);
  pts.push([room.x + lx, room.y + ly]);
  a.path = pts.filter(function (p, i) { return !i || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]; });
}

function goal(a) {
  var home = roomById(a.name), hub = roomById('hub');
  if (a.state === 'working' || a.state === 'sleeping') return { room: home, x: SEAT.x, y: SEAT.y, key: a.state };
  if (a.state === 'error') return { room: home, x: CX, y: CY + 20, key: 'error' };
  if (!a.spot || performance.now() > a.nextWander) {
    var taken = Object.keys(cast).map(function (k) { return cast[k] !== a ? cast[k].spot : null; });
    var free = IDLE_SPOTS.filter(function (s) { return taken.indexOf(s) < 0; });
    a.spot = free[Math.floor(Math.random() * free.length)] || IDLE_SPOTS[0];
    a.nextWander = performance.now() + 6000 + Math.random() * 9000;
  }
  return { room: hub, x: a.spot[0], y: a.spot[1], key: 'idle' + a.spot.join() };
}

function moveAgent(a, dt) {
  if (!a.path.length) {
    var gl = goal(a);
    if (gl.key !== a.goalKey) { plan(a, gl.room, gl.x, gl.y); a.goalKey = gl.key; }
  }
  if (!a.path.length) { a.walkT = 0; a.face = (a.state === 'working' || a.state === 'sleeping') ? 'up' : 'down'; return; }

  var speed = 42 * dt, target = a.path[0];
  var dx = target[0] - a.x, dy = target[1] - a.y;
  if (Math.abs(dx) > 0.01) { a.x += Math.sign(dx) * Math.min(Math.abs(dx), speed); a.face = dx < 0 ? 'left' : 'right'; }
  else if (Math.abs(dy) > 0.01) { var sy = Math.sign(dy) * Math.min(Math.abs(dy), speed); a.y += sy; a.face = sy < 0 ? 'up' : 'down'; }
  if (Math.abs(target[0] - a.x) < 0.01 && Math.abs(target[1] - a.y) < 0.01) { a.x = target[0]; a.y = target[1]; a.path.shift(); }
  a.walkT += dt;
}

/* 10x15 characters: hair, face, jacket in the agent colour, dark trousers */
var SPRITE = {
  down: ['..hhhhhh..', '.hhhhhhhh.', '.hhhhhhhh.', '.hssssssh.', '.sesssses.', '.ssssssss.', '..ssmmss..', '..jjjjjj..', '.jjjjjjjj.', 'sjjjwwjjjs', 'sjjjjjjjds', '.jjjjjjjd.', '..pp..pp..', '..pp..pp..', '..kk..kk..'],
  up:   ['..hhhhhh..', '.hhhhhhhh.', '.hhhhhhhh.', '.hhhhhhhh.', '.hhhhhhhh.', '.shhhhhhs.', '..ssssss..', '..jjjjjj..', '.jjjjjjjj.', 'sjjjjjjjjs', 'sjjjjjjjds', '.jjjjjjjd.', '..pp..pp..', '..pp..pp..', '..kk..kk..'],
  side: ['..hhhhhh..', '.hhhhhhhh.', '.hhhhhhhh.', '.hhhhssss.', '.hhhsssse.', '.hhhsssss.', '..hhssss..', '..jjjjjj..', '.jjjjjjjj.', '.jjjjjjjs.', '.jjjjjjjd.', '.jjjjjjjd.', '..pp..pp..', '..pp..pp..', '..kk..kk..']
};

function drawAgent(g, a, now) {
  var walking = a.path.length > 0;
  var rows = a.face === 'up' ? SPRITE.up : (a.face === 'left' || a.face === 'right') ? SPRITE.side : SPRITE.down;
  var flip = a.face === 'left';
  var pal = {
    h: mix(a.tint, '#15121f', 0.7), s: '#f1c7a4', e: '#1b1626', m: '#c9867a',
    j: a.tint, d: mix(a.tint, '#000000', 0.3), w: mix(a.tint, '#ffffff', 0.5), p: '#2c3140', k: '#14161c'
  };
  if (a.state === 'sleeping') { pal.j = mix(a.tint, '#1b1626', 0.45); pal.d = mix(a.tint, '#1b1626', 0.6); }

  var step = walking ? Math.floor(a.walkT * 8) % 2 : 0;
  var bob = walking && step ? -1 : 0;
  var typing = a.state === 'working' && !walking && Math.floor(now / 170) % 2;
  var ox = Math.round(a.x) - 5, oy = Math.round(a.y) - 15 + bob;

  g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(ox + 1, Math.round(a.y) - 1, 8, 3);

  if (picked === a.name) {
    var pulse = (Math.sin(now / 200) + 1) / 2;
    g.fillStyle = a.tint; g.globalAlpha = 0.4 + pulse * 0.5;
    g.fillRect(ox - 3, Math.round(a.y) + 1, 16, 1); g.fillRect(ox - 1, Math.round(a.y) + 2, 12, 1);
    g.globalAlpha = 1;
  }

  for (var y = 0; y < rows.length; y++) {
    var row = rows[y];
    if (step && y === 12) row = '.pp....pp.';
    if (step && y === 13) row = '.pp....pp.';
    if (step && y === 14) row = '.kk....kk.';
    if (typing && y === 9) row = 'jjjjjjjjjj';
    if (typing && y === 10) row = '.jjjjjjjd.';
    for (var x = 0; x < 10; x++) {
      var ch = row[flip ? 9 - x : x];
      if (ch === '.') continue;
      g.fillStyle = pal[ch]; g.fillRect(ox + x, oy + y, 1, 1);
    }
  }

  /* speech bubble */
  var say = null, border = a.tint, ink = '#f4f1f7';
  if (a.state === 'working') say = clean(a.task || 'kerja', 24);
  else if (a.state === 'error') { say = '! ' + clean(a.task || 'error', 22); border = '#ff5a5a'; ink = '#ffd2cf'; }
  else if (a.state === 'sleeping') say = Math.floor(now / 600) % 2 ? 'Z Z' : 'Z';
  else if (picked === a.name) say = clean(a.name, 16);

  if (say && (a.state !== 'error' || Math.floor(now / 500) % 4 !== 0)) {
    var w = textWidth(say) + 6, bx = Math.max(2, Math.min(LW - w - 2, Math.round(a.x) - Math.floor(w / 2))), by = oy - 12;
    g.fillStyle = 'rgba(6,7,11,0.9)'; g.fillRect(bx, by, w, 9);
    g.fillStyle = border; g.fillRect(bx, by, w, 1); g.fillRect(bx, by + 8, w, 1); g.fillRect(bx, by, 1, 9); g.fillRect(bx + w - 1, by, 1, 9);
    g.fillRect(Math.round(a.x), by + 9, 1, 2);
    text(g, say, bx + 3, by + 2, ink);
  }
}

/* ================= animated layer (pixel space) ================= */

function disc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (var y = -r; y <= r; y++) { var w = Math.floor(Math.sqrt(r * r - y * y)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
}
function ring(g, cx, cy, r, thick, col) {
  g.fillStyle = col;
  for (var y = -r; y <= r; y++) {
    var w = Math.floor(Math.sqrt(r * r - y * y)), ri = r - thick, inner = Math.abs(y) < ri ? Math.floor(Math.sqrt(ri * ri - y * y)) : -1;
    if (inner < 0) g.fillRect(cx - w, cy + y, w * 2 + 1, 1);
    else { g.fillRect(cx - w, cy + y, w - inner, 1); g.fillRect(cx + inner + 1, cy + y, w - inner, 1); }
  }
}

function busyCount() { return Object.keys(cast).filter(function (k) { return cast[k].state === 'working'; }).length; }

function drawLive(g, now) {
  /* screens */
  SCREENS.forEach(function (s, idx) {
    var a = cast[s.owner];
    var on = a && a.state === 'working', err = a && a.state === 'error';
    g.fillStyle = err ? (Math.floor(now / 300) % 2 ? '#5a1414' : '#2a0b0b') : on ? mix(s.tint, '#07090d', 0.72) : '#10131a';
    g.fillRect(s.x, s.y, s.w, s.h);
    if (err) { text(g, '!', s.x + Math.floor(s.w / 2) - 1, s.y + Math.floor(s.h / 2) - 2, '#ff8a80'); return; }
    if (!on) { g.fillStyle = '#1a1f2a'; g.fillRect(s.x + 2, s.y + 2, 4, 1); return; }
    g.fillStyle = mix(s.tint, '#ffffff', 0.35);
    if (s.style === 'wave' || s.style === 'bars') {
      for (var cx = 1; cx < s.w - 1; cx++) {
        var v = s.style === 'wave' ? (Math.sin((cx + now / 120) / 3) + 1) / 2 : hash(cx, Math.floor(now / 200));
        var bh = Math.max(1, Math.floor(v * (s.h - 3)));
        g.fillRect(s.x + cx, s.y + s.h - 1 - bh, 1, bh);
      }
      return;
    }
    if (s.style === 'scan') {
      var sy = s.y + Math.floor((now / 40) % s.h);
      g.fillRect(s.x, sy, s.w, 1);
      g.globalAlpha = 0.35; g.fillRect(s.x, Math.max(s.y, sy - 3), s.w, 3); g.globalAlpha = 1;
      return;
    }
    for (var ln = 0; ln < Math.floor((s.h - 2) / 3); ln++) {
      var len = Math.floor(hash(idx + 1, ln + Math.floor(now / 650)) * (s.w - 6)) + 3;
      g.fillRect(s.x + 2, s.y + 2 + ln * 3, len, 1);
    }
  });

  /* cinema screen always plays */
  if (BIGSCREEN) {
    var b = BIGSCREEN, watching = cast.watcher && cast.watcher.state === 'working';
    for (var x = 0; x < b.w; x++) {
      var v2 = (Math.sin((x + now / (watching ? 60 : 160)) / 6) + Math.sin((x - now / 200) / 11) + 2) / 4;
      g.fillStyle = mix('#0e2a44', b.tint, v2 * (watching ? 1 : 0.55));
      g.fillRect(b.x + x, b.y, 1, b.h);
    }
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(b.x, b.y + Math.floor((now / 50) % b.h), b.w, 1);
  }

  /* server lights */
  var fetching = cast['fetcher'] && cast['fetcher'].state === 'working';
  LEDS.forEach(function (d) {
    var lit = hash(d.seed * 99, Math.floor(now / (fetching ? 90 : 800))) > (fetching ? 0.3 : 0.6);
    g.fillStyle = lit ? (hash(d.seed, 3) > 0.7 ? '#5fe08a' : d.tint) : '#2a2f3a';
    g.fillRect(d.x, d.y, 2, 1);
  });

  /* waterfall and pool */
  WATER.forEach(function (w) {
    for (var x2 = 0; x2 < w.w; x2++) for (var y2 = 0; y2 < w.h; y2 += 1) {
      var v3 = hash(x2, Math.floor(y2 - now / 60));
      g.fillStyle = v3 > 0.75 ? '#d6fff6' : v3 > 0.35 ? '#48d6a0' : '#1f8a6a';
      g.fillRect(w.x + x2, w.y + y2, 1, 1);
    }
    var p = w.pool;
    g.fillStyle = '#16644f'; g.fillRect(p.x, p.y, p.w, p.h);
    for (var k = 0; k < 6; k++) {
      var rx = p.x + Math.floor(hash(k, Math.floor(now / 400)) * (p.w - 4)), ry = p.y + 2 + Math.floor(hash(k * 3, Math.floor(now / 400)) * (p.h - 4));
      g.fillStyle = '#7fe8c4'; g.fillRect(rx, ry, 3, 1);
    }
  });

  /* steam puffs */
  STEAM.forEach(function (s) {
    for (var k = 0; k < 4; k++) {
      var t = ((now / 1400) + k / 4) % 1;
      g.fillStyle = 'rgba(220,230,240,' + (0.45 * (1 - t)).toFixed(2) + ')';
      var r = 1 + Math.floor(t * 4);
      g.fillRect(s.x + Math.round(Math.sin(t * 6 + k) * 3) - r, s.y - Math.round(t * 22) - r, r * 2, r * 2);
    }
  });

  TUBES.forEach(function (tb, n) {
    g.fillStyle = tb.col; g.fillRect(tb.x, tb.y + 8, 4, tb.h - 8);
    var by2 = tb.y + tb.h - 2 - Math.floor(((now / 700) + n * 0.3) % 1 * (tb.h - 10));
    g.fillStyle = '#ffffff'; g.fillRect(tb.x + 1, by2, 1, 1);
  });

  /* hologram tables */
  HOLO.forEach(function (hl, n) {
    ring(g, hl.x, hl.y, 9, 2, '#2a2f3a');
    disc(g, hl.x, hl.y, 6, '#141820');
    var spin = now / 500 + n;
    g.fillStyle = mix(hl.tint, '#ffffff', 0.3);
    for (var k = 0; k < 3; k++) {
      var ang = spin + k * 2.1;
      g.fillRect(Math.round(hl.x + Math.cos(ang) * 5), Math.round(hl.y - 8 + Math.sin(ang) * 2), 2, 2);
    }
    g.globalAlpha = 0.25; g.fillRect(hl.x - 4, hl.y - 12, 8, 10); g.globalAlpha = 1;
  });

  /* reactor on the bridge: beats faster while anyone works */
  if (REACTOR) {
    var busy = busyCount();
    var beat = (Math.sin(now / (busy ? 170 : 650)) + 1) / 2;
    ring(g, REACTOR.x, REACTOR.y, 28, 5, '#3a2410');
    ring(g, REACTOR.x, REACTOR.y, 24, 3, '#ff9d3c');
    ring(g, REACTOR.x, REACTOR.y, 19, 2, '#7a4418');
    disc(g, REACTOR.x, REACTOR.y, 13 + Math.round(beat * 3), mix('#ff7a1a', '#ffe6a8', beat));
    disc(g, REACTOR.x, REACTOR.y, 7, '#fff6de');
    for (var k2 = 0; k2 < 6; k2++) {
      var ang2 = now / 1100 + k2 * Math.PI / 3;
      g.fillStyle = '#ffd08a';
      g.fillRect(Math.round(REACTOR.x + Math.cos(ang2) * 24) - 1, Math.round(REACTOR.y + Math.sin(ang2) * 24) - 1, 3, 3);
    }
  }

  /* data packets travel from the bridge to every working room */
  var hub = roomById('hub');
  Object.keys(cast).forEach(function (key) {
    var a = cast[key];
    if (a.state !== 'working') return;
    var hops = route(hub, roomById(a.name)), pts = [];
    for (var h2 = 0; h2 < hops.length; h2++) pts.push([hops[h2].x + CX, hops[h2].y + (h2 === 0 ? hops[h2].laneY : CY)]);
    if (pts.length < 2) return;
    var total = pts.length - 1, tt = ((now / 1700) + a.i * 0.37) % 1;
    var seg = Math.min(total - 1, Math.floor(tt * total)), f = tt * total - seg;
    var px = Math.round(pts[seg][0] + (pts[seg + 1][0] - pts[seg][0]) * f), py = Math.round(pts[seg][1] + (pts[seg + 1][1] - pts[seg][1]) * f);
    g.fillStyle = a.tint; g.fillRect(px - 2, py - 2, 4, 4);
    g.fillStyle = '#ffffff'; g.fillRect(px - 1, py - 1, 2, 2);
  });
}

/* ================= glow layer (screen space, soft light) ================= */

function drawGlow(g, now, k) {
  g.save();
  g.globalCompositeOperation = 'lighter';

  ROOMS.forEach(function (rm) {
    if (rm.kind === 'empty') return;
    var a = cast[rm.id];
    var col = rm.tint, alpha = 0.55 + 0.12 * Math.sin(now / 1100 + rm.i);
    if (a && a.state === 'working') alpha = 0.9 + 0.1 * Math.sin(now / 240 + rm.i);
    if (a && a.state === 'error') { col = '#ff4040'; alpha = Math.floor(now / 400) % 2 ? 1 : 0.25; }
    if (a && a.state === 'sleeping') alpha = 0.25;
    g.globalAlpha = Math.max(0, alpha);
    g.shadowColor = col; g.shadowBlur = 14 * k;
    g.strokeStyle = col; g.lineWidth = 2 * k;
    g.strokeRect((rm.x + 2) * k, (rm.y + 2) * k, (RW - 4) * k, (RH - 4) * k);
  });

  g.shadowBlur = 0;
  LAMPS.forEach(function (l) {
    var c = rgb(l.tint).join(',');
    var lg = g.createRadialGradient(l.x * k, l.y * k, 0, l.x * k, l.y * k, 20 * k);
    lg.addColorStop(0, 'rgba(' + c + ',0.32)'); lg.addColorStop(1, 'rgba(' + c + ',0)');
    g.globalAlpha = 1; g.fillStyle = lg; g.fillRect((l.x - 20) * k, (l.y - 20) * k, 40 * k, 40 * k);
  });
  if (REACTOR) {
    var busy = busyCount(), beat = (Math.sin(now / (busy ? 170 : 650)) + 1) / 2;
    var grd = g.createRadialGradient(REACTOR.x * k, REACTOR.y * k, 0, REACTOR.x * k, REACTOR.y * k, (60 + beat * 14) * k);
    grd.addColorStop(0, 'rgba(255,170,70,' + (0.55 + beat * 0.25).toFixed(2) + ')');
    grd.addColorStop(1, 'rgba(255,120,30,0)');
    g.globalAlpha = 1; g.fillStyle = grd;
    g.fillRect((REACTOR.x - 80) * k, (REACTOR.y - 80) * k, 160 * k, 160 * k);
  }

  SCREENS.forEach(function (s) {
    var a = cast[s.owner];
    if (!a || (a.state !== 'working' && a.state !== 'error')) return;
    var c = a.state === 'error' ? '255,70,70' : rgb(s.tint).join(',');
    var gr = g.createRadialGradient((s.x + s.w / 2) * k, (s.y + s.h / 2) * k, 0, (s.x + s.w / 2) * k, (s.y + s.h / 2) * k, (s.w * 0.9) * k);
    gr.addColorStop(0, 'rgba(' + c + ',0.28)'); gr.addColorStop(1, 'rgba(' + c + ',0)');
    g.fillStyle = gr; g.fillRect((s.x - s.w) * k, (s.y - s.w) * k, s.w * 3 * k, s.w * 3 * k);
  });

  WATER.forEach(function (w) {
    var gr2 = g.createRadialGradient((w.x + 7) * k, (w.y + 40) * k, 0, (w.x + 7) * k, (w.y + 40) * k, 46 * k);
    gr2.addColorStop(0, 'rgba(72,214,160,0.22)'); gr2.addColorStop(1, 'rgba(72,214,160,0)');
    g.fillStyle = gr2; g.fillRect((w.x - 46) * k, (w.y - 10) * k, 100 * k, 100 * k);
  });

  if (BIGSCREEN) {
    var gr3 = g.createRadialGradient((BIGSCREEN.x + 39) * k, (BIGSCREEN.y + 30) * k, 0, (BIGSCREEN.x + 39) * k, (BIGSCREEN.y + 30) * k, 70 * k);
    gr3.addColorStop(0, 'rgba(92,200,240,0.2)'); gr3.addColorStop(1, 'rgba(92,200,240,0)');
    g.fillStyle = gr3; g.fillRect((BIGSCREEN.x - 40) * k, (BIGSCREEN.y - 20) * k, 160 * k, 130 * k);
  }

  g.restore();
}

/* ================= render loop ================= */

var canvas = document.getElementById('station'), ctx = canvas.getContext('2d');
var BG = null, scale = 1, lastFrame = performance.now();

function fit() {
  var box = document.getElementById('world');
  var dpr = window.devicePixelRatio || 1;
  var pad = (parseFloat(getComputedStyle(box).paddingLeft) || 0) * 2;
  var room = box.clientWidth - pad;
  /* whole-number scale for crisp pixels; the element itself fills the width */
  scale = Math.max(1, Math.round(room * dpr / LW));
  canvas.width = LW * scale; canvas.height = LH * scale;
  canvas.style.width = room + 'px';
  canvas.style.height = 'auto';
}

function frame(now) {
  var dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  if (!BG) BG = paintStatic();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(BG, 0, 0);
  drawLive(ctx, now);
  var list = Object.keys(cast).map(function (k) { return cast[k]; });
  list.forEach(function (a) { moveAgent(a, dt); });
  list.sort(function (p, q) { return p.y - q.y; }).forEach(function (a) { drawAgent(ctx, a, now); });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawGlow(ctx, now, scale);
  requestAnimationFrame(frame);
}

canvas.addEventListener('click', function (e) {
  var r = canvas.getBoundingClientRect();
  var lx = (e.clientX - r.left) / r.width * LW, ly = (e.clientY - r.top) / r.height * LH;
  var hit = null;
  Object.keys(cast).forEach(function (k) {
    var a = cast[k];
    if (Math.abs(lx - a.x) <= 7 && ly >= a.y - 17 && ly <= a.y + 2) hit = a;
  });
  if (hit) return pick(hit.name);
  var rm = roomAtPoint(lx, ly);
  if (rm && cast[rm.id]) pick(rm.id);
});

window.addEventListener('resize', fit);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { picked = null; sigUnits = null; drawUnits(); }
});
document.getElementById('clearpick').onclick = function () { picked = null; sigUnits = null; drawUnits(); };

/* ================= data from /api/state ================= */

function draw(agents) {
  var busy = 0;
  agents.forEach(function (info, i) {
    var a = cast[info.name] || (cast[info.name] = new Agent(info, i));
    var sig = info.state + '|' + (info.task || '');
    var first = a.seen === undefined;
    var changed = !first && a.seen !== sig;
    a.seen = sig;
    a.state = info.state; a.task = info.task || ''; a.runs = info.runs || 0; a.at = info.at || null; a.at = info.at || null;
    if (first) {
      /* first load: place everyone where they belong instead of marching in */
      var gl = goal(a);
      a.x = gl.room.x + gl.x; a.y = gl.room.y + gl.y; a.goalKey = gl.key;
    }
    if (info.state === 'working') busy++;
    if (changed) {
      logBeat(info.name, info.state, info.task);
      if (info.state === 'working') note(info.name + ' mulai kerja');
    }
  });
  document.getElementById('workcount').textContent = busy + '/' + agents.length + ' kerja';
  document.getElementById('workcount2').textContent = busy + '/' + agents.length;
  drawUnits();
}

function pick(name) {
  picked = picked === name ? null : name;
  sigUnits = null;
  drawUnits();
}

function ago(iso) {
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'baru saja';
  if (s < 3600) return Math.floor(s / 60) + ' menit lalu';
  if (s < 86400) return Math.floor(s / 3600) + ' jam lalu';
  return Math.floor(s / 86400) + ' hari lalu';
}

function note(text) {
  var host = document.getElementById('notes');
  var el = document.createElement('div');
  el.textContent = text;
  host.appendChild(el);
  setTimeout(function () { el.remove(); }, 4200);
}


function logBeat(name, state, task) {
  beats.unshift({ at: new Date(), name: name, state: state, task: task });
  beats = beats.slice(0, 16);
  document.getElementById('log').innerHTML = beats.map(function (b) {
    return '<div class="beat"><s style="background:' + (HUE[b.state] || '#888') + '"></s>' +
      '<span><b style="color:' + (TINT[b.name] || '#888') + ';font-weight:500">' + h(b.name) + '</b> ' +
      h(EVENT[b.state] || b.state) + (b.task ? ' &middot; ' + h(b.task.slice(0, 26)) : '') + '</span>' +
      '<time>' + b.at.toLocaleTimeString('id-ID') + '</time></div>';
  }).join('');
}

function drawUnits() {
  var list = Object.keys(cast).map(function (k) { return cast[k]; }).sort(function (p, q) { return p.i - q.i; });
  if (!list.length) return;

  var sig = list.map(function (a) { return a.name + a.state + a.task + a.runs + a.at + (picked === a.name); }).join('|');
  if (sig === sigUnits) return;
  sigUnits = sig;

  /* rows are rebuilt on change; keep keyboard focus on the same agent */
  var focused = document.activeElement && document.activeElement.classList.contains('unit')
    ? document.activeElement.getAttribute('data-n') : null;
  document.getElementById('clearpick').hidden = !picked;

  document.getElementById('units').innerHTML = list.map(function (a) {
    var stale = a.state === 'error' && a.at && (Date.now() - new Date(a.at).getTime()) > 20 * 60 * 1000;
    var cls = a.state === 'working' ? ' busy' : (a.state === 'error' ? (stale ? ' old' : ' broke') : '');
    var word = a.state === 'error' && stale ? 'error lama' : (WORD[a.state] || a.state);
    var sub = a.task ? a.task.slice(0, 34) : 'belum ada kerjaan';
    if (a.state === 'error' && a.at) sub = sub + ' - ' + ago(a.at);

    return '<button type="button" class="unit' + (picked === a.name ? ' picked' : '') + '" data-n="' + h(a.name) + '"' +
      ' aria-pressed="' + (picked === a.name) + '" aria-label="' + h(a.name + ', ' + word + ', ' + sub) + '">' +
      '<span class="swatch" style="background:' + (TINT[a.name] || '#888') + '"></span>' +
      '<span style="min-width:0"><span class="nm2" style="color:' + (TINT[a.name] || '#888') + '">' + h(a.name) +
      ' <span style="color:var(--ink-2)">+' + (Number(a.runs) || 0) + '</span></span>' +
      '<span class="doing">' + h(sub) + '</span></span>' +
      '<span class="state' + cls + '">' + h(word) + '</span></button>';
  }).join('');

  [].forEach.call(document.querySelectorAll('.unit'), function (row) {
    row.onclick = function () { pick(row.getAttribute('data-n')); };
    if (row.getAttribute('data-n') === focused) row.focus();
  });
}

fit();
requestAnimationFrame(frame);

function offline(err) {
  if (err && err.message === 'login') return;
  /* the server answered but with a problem: show its words instead of guessing */
  var said = err && err.fromServer ? err.message : null;
  document.getElementById('led').className = 'led bad';
  document.getElementById('linktext').textContent = said ? 'ada masalah' : 'server mati';
  document.getElementById('linktext').classList.add('lost');
  if (!everLoaded || said) {
    document.getElementById('units').innerHTML = said
      ? '<div class="none lost"><b>Server menjawab dengan error.</b>' + said.replace(/</g, '&lt;') + '</div>'
      : '<div class="none lost"><b>Tidak bisa menghubungi server.</b>Jalankan npm run dashboard, lalu muat ulang.</div>';
  }
}

function logout(everywhere) {
  fetch('/api/logout', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ everywhere: !!everywhere })
  }).catch(function () {}).then(function () { location.replace('/login.html'); });
}
document.getElementById('out-here').onclick = function () { logout(false); };
document.getElementById('out-all').onclick = function () {
  if (confirm('Keluar dari semua perangkat? Semua sesi login lain ikut berakhir.')) logout(true);
};

function tick() {
  fetch('/api/state').then(function (r) {
    /* online version: no session means go log in */
    if (r.status === 401) { location.replace('/login.html'); throw new Error('login'); }
    if (!r.ok) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        var e = new Error(d.error || ('HTTP ' + r.status)); e.fromServer = true; throw e;
      });
    }
    return r.json();
  }).then(function (s) {
    everLoaded = true;
    document.getElementById('linktext').classList.remove('lost');
    draw(s.agents);

    var up = !!s.bot;
    document.getElementById('led').className = 'led ' + (up ? 'ok' : 'bad');
    document.getElementById('gateled').className = 'led ' + (up ? 'ok' : 'bad');
    document.getElementById('linktext').textContent = up ? 'bot aktif' : (s.remote && !s.fresh ? 'laptop mati' : 'bot mati');
    document.getElementById('logout').hidden = !s.remote;
    document.getElementById('gatetext').textContent = up ? 'gateway running' : 'gateway off';
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('id-ID');

    var topics = (s.topics && s.topics.topics) || [];
    document.getElementById('topiccount').textContent = topics.length ? '(' + topics.length + ')' : '';

    var tSig = topics.map(function (t) { return t.game + t.popularity; }).join('|');
    if (tSig !== sigTopics) {
      sigTopics = tSig;
      document.getElementById('topics').innerHTML = topics.length
        ? topics.map(function (t, i) {
            var p = Number(t.popularity) || 0;
            return '<div class="line2" style="animation-delay:' + (i * 35) + 'ms">' +
              '<span class="num">' + (i + 1) + '</span>' +
              '<span class="name3">' + h(t.game) + ' <span class="yr">' + h(t.release_year || '') + '</span></span>' +
              '<span class="meter"><span class="rail2"><span class="lvl" style="width:' + (p * 10) + '%;animation-delay:' + (i * 35 + 180) + 'ms"></span></span>' +
              '<span class="lvlnum">' + (p || '?') + '</span></span></div>';
          }).join('')
        : '<div class="none"><b>Belum ada topik.</b>Ketik !scout di Discord.</div>';
    }

    var cuts = s.renders || [];
    document.getElementById('rendercount').textContent = cuts.length ? '(' + cuts.length + ')' : '';
    var rSig = cuts.map(function (c) { return c.file + c.pass + c.mb; }).join('|');
    if (rSig !== sigRenders) {
      sigRenders = rSig;
      document.getElementById('renders').innerHTML = cuts.length
        ? cuts.map(function (c, i) {
            var mark = c.draft ? 'draft' : c.pass === true ? 'good' : c.pass === false ? 'bad' : '';
            var word = c.draft ? 'draft' : c.pass === true ? 'lulus' : c.pass === false ? 'gagal' : 'belum dicek';
            var sub = Math.round(Number(c.seconds) || 0) + ' detik &middot; ' + (Number(c.mb) || 0) + ' MB &middot; ' + (Number(c.scenes) || 0) + ' scene';
            return '<div class="cut" style="animation-delay:' + (i * 35) + 'ms">' +
              '<span class="verdict ' + mark + '">' + word + '</span>' +
              '<span class="about"><b>' + h(String(c.slug).replace(/^\d+d-/, '').replace(/-/g, ' ').slice(0, 30)) + '</b>' +
              '<span>' + (c.problem ? h(c.problem.slice(0, 40)) : sub) + '</span></span>' +
              (s.remote
                ? '<span class="grab" title="Filenya ada di laptop" style="opacity:.55">di laptop</span></div>'
                : '<a class="grab" href="/download/' + encodeURIComponent(c.file) + '">Unduh</a></div>');
          }).join('')
        : '<div class="none"><b>Belum ada video.</b>Ketik !scout, atau tunggu rutinitas pagi.</div>';
    }

    var docs = s.files || [];
    var dSig = docs.map(function (f) { return f.name; }).join('|');
    if (lastDocs !== null && dSig !== lastDocs) note('file baru dibuat');
    lastDocs = dSig;

    if (dSig !== sigDocs) {
      sigDocs = dSig;
      document.getElementById('files').innerHTML = docs.length
        ? docs.map(function (f, i) {
            var kind = f.name.indexOf('script-') === 0 ? 'script'
                     : f.name.indexOf('watch-') === 0 ? 'watch'
                     : f.name.indexOf('links-') === 0 ? 'links' : 'assets';
            var label = { script: 'naskah', watch: 'tontonan', links: 'link', assets: 'aset' }[kind];
            var title = f.name.replace(/^(script|assets|watch|links)-/, '').replace(/\.md$/, '').replace(/-/g, ' ');
            return '<div class="doc" style="animation-delay:' + (i * 35) + 'ms">' +
              '<span class="kind ' + kind + '">' + label + '</span>' +
              '<span class="name3">' + h(title.slice(0, 28)) + '</span>' +
              '<span class="when">' + ago(f.at) + '</span></div>';
          }).join('')
        : '<div class="none"><b>Belum ada file.</b>Mulai dari !scout di Discord.</div>';
    }
  }).catch(function (err) {
    /* "login" is the expected redirect for a signed-out visitor, not an error */
    if (err.message !== 'login') console.error(err);
    offline(err);
  });
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
